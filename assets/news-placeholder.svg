<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="ArchStudent news">
  <rect width="800" height="500" fill="#f1efe9"/>
  <g fill="none" stroke="#1d3a53" stroke-width="6" stroke-linejoin="round" opacity="0.9">
    <!-- skyline of simple buildings -->
    <rect x="150" y="250" width="90" height="180"/>
    <rect x="255" y="190" width="70" height="240"/>
    <rect x="340" y="290" width="110" height="140"/>
    <rect x="465" y="150" width="80" height="280"/>
    <rect x="560" y="240" width="95" height="190"/>
    <!-- windows -->
    <g stroke-width="4" opacity="0.55">
      <line x1="270" y1="220" x2="310" y2="220"/><line x1="270" y1="255" x2="310" y2="255"/>
      <line x1="270" y1="290" x2="310" y2="290"/><line x1="270" y1="325" x2="310" y2="325"/>
      <line x1="482" y1="185" x2="528" y2="185"/><line x1="482" y1="225" x2="528" y2="225"/>
      <line x1="482" y1="265" x2="528" y2="265"/><line x1="482" y1="305" x2="528" y2="305"/>
    </g>
  </g>
  <!-- ground line -->
  <line x1="120" y1="430" x2="680" y2="430" stroke="#c9c2b4" stroke-width="5"/>
  <!-- crane accent -->
  <g stroke="#b8492e" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="610" y1="120" x2="610" y2="430"/>
    <line x1="560" y1="120" x2="700" y2="120"/>
    <line x1="610" y1="120" x2="640" y2="150"/>
    <line x1="575" y1="120" x2="575" y2="150"/>
  </g>
  <text x="400" y="472" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#8f857a">ArchStudent · World Architecture News</text>
</svg>
