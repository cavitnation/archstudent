name: PHP CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, simplexml, pdo_sqlite, gd
          coverage: none
      - run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/storage.php
      - run: python3 tests/http-security.py
      - run: python3 tests/migration.py
      - run: python3 tests/source-hygiene.py
